<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" width="1120" height="650" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">从 Agent 结论到可信动作的证据门禁</title>
  <desc id="diagram-desc">Agent 的自然语言结论经过结构化证据、独立验证和动作门禁，最终形成可审计的副作用。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#625d56"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#a14f4f"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .title { font-size: 28px; font-weight: 700; fill: #1f1d1a; }
    .subtitle { font-size: 14px; fill: #6f6961; }
    .node-title { font-size: 16px; font-weight: 700; fill: #1f1d1a; }
    .body { font-size: 13px; fill: #59544e; }
    .small { font-size: 12px; fill: #6f6961; }
    .claim { fill: #f8f6f2; stroke: #9b948a; stroke-width: 1.5; }
    .evidence { fill: #dbeafe; stroke: #416b9b; stroke-width: 1.5; }
    .verify { fill: #dcfce7; stroke: #4d8058; stroke-width: 1.5; }
    .gate { fill: #fef3c7; stroke: #9a7843; stroke-width: 1.5; }
    .action { fill: #fce7f3; stroke: #98607d; stroke-width: 1.5; }
    .panel { fill: #ffffff; stroke: #ddd7ce; stroke-width: 1.4; }
    .edge { fill: none; stroke: #625d56; stroke-width: 2; marker-end: url(#arrow); }
    .fail-edge { fill: none; stroke: #a14f4f; stroke-width: 1.8; stroke-dasharray: 7 6; marker-end: url(#arrow-red); }
  </style>

  <rect width="1120" height="650" fill="#f8f6f3"/>
  <rect x="28" y="24" width="1064" height="602" rx="20" fill="#fffdf8" stroke="#d9d3ca" stroke-width="1.4"/>
  <text x="60" y="70" class="title">从 Agent 结论到可信动作</text>
  <text x="60" y="96" class="subtitle">自然语言负责解释，结构化证据负责证明；副作用越大，动作门槛越高。</text>

  <rect x="56" y="132" width="1008" height="258" rx="18" class="panel"/>

  <rect x="80" y="205" width="168" height="96" rx="14" class="claim"/>
  <text x="164" y="236" class="node-title" text-anchor="middle">Agent 结论</text>
  <text x="164" y="261" class="body" text-anchor="middle">“测试已经通过”</text>
  <text x="164" y="282" class="small" text-anchor="middle">可读，但尚未证实</text>

  <rect x="294" y="184" width="190" height="138" rx="14" class="evidence"/>
  <text x="389" y="217" class="node-title" text-anchor="middle">结构化证据</text>
  <text x="389" y="244" class="body" text-anchor="middle">commit / command</text>
  <text x="389" y="267" class="body" text-anchor="middle">exit code / report</text>
  <text x="389" y="290" class="body" text-anchor="middle">timestamp / receipt</text>

  <rect x="530" y="184" width="190" height="138" rx="14" class="verify"/>
  <text x="625" y="217" class="node-title" text-anchor="middle">独立验证</text>
  <text x="625" y="244" class="body" text-anchor="middle">检查原始产物</text>
  <text x="625" y="267" class="body" text-anchor="middle">交叉验证来源</text>
  <text x="625" y="290" class="body" text-anchor="middle">隔离提出者与批准者</text>

  <polygon points="822,180 916,253 822,326 728,253" class="gate"/>
  <text x="822" y="244" class="node-title" text-anchor="middle">动作门禁</text>
  <text x="822" y="269" class="body" text-anchor="middle">证据充分？</text>

  <rect x="940" y="205" width="100" height="96" rx="14" class="action"/>
  <text x="990" y="237" class="node-title" text-anchor="middle">执行</text>
  <text x="990" y="262" class="body" text-anchor="middle">发布</text>
  <text x="990" y="283" class="small" text-anchor="middle">可审计</text>

  <path d="M 248 253 H 294" class="edge"/>
  <path d="M 484 253 H 530" class="edge"/>
  <path d="M 720 253 H 728" class="edge"/>
  <path d="M 916 253 H 940" class="edge"/>

  <rect x="80" y="432" width="960" height="128" rx="16" fill="#fff8f7" stroke="#dfc1bd" stroke-width="1.3"/>
  <text x="104" y="464" class="node-title">最危险的捷径：把自述直接当作完成证据</text>
  <text x="104" y="491" class="body">当“我做完了”直接触发发布，前面的多数投票只会放大共同错误，无法补回缺失的事实验证。</text>
  <text x="104" y="519" class="small">修复方向：保存原始证据，让不同方法和不同权限主体参与复核，并为失败保留回滚路径。</text>
  <path d="M 164 301 V 368 H 822 V 326" class="fail-edge"/>
  <line x1="477" y1="355" x2="495" y2="373" stroke="#a14f4f" stroke-width="3"/>
  <line x1="495" y1="355" x2="477" y2="373" stroke="#a14f4f" stroke-width="3"/>
  <text x="512" y="369" class="small" fill="#a14f4f">禁止绕过证据链</text>

  <text x="560" y="594" class="body" text-anchor="middle">可信度来自证据链和权限边界，而非 Agent 数量。</text>
</svg>
